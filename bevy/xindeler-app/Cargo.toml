[package]
name = "xindeler-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# FPS overlay (bevy_dev_tools::fps_overlay) needs the UI render stack + a default
# font — enable this from the CLIENT binary only; the server shell stays headless.
fps-overlay = ["bevy/bevy_dev_tools"]

[dependencies]
# Bevy pinned EXACT per BL-82 [Q5]=A — bump only via the contained per-release PR (EM-6.3).
# No render/window features here: states/schedules/settings/diagnostics only.
# The render stack lives in the client binary (features are additive workspace-wide,
# but this crate must stay usable from the headless server shell).
bevy = { version = "=0.19.0", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_state",
] }
ron = { workspace = true }
serde = { workspace = true }
# BL-82 EM-5.11: the persisted `controls` section (keymap + gamepad bindings)
# lives on `XindelerSettings` (extended, not forked — same seam as
# `graphics`/`ui_scale`). `xindeler-input` is itself a pure input-MODEL crate
# (no render/window features of its own), same posture as this crate.
xindeler-input = { path = "../xindeler-input" }
