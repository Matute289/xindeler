[package]
name = "xindeler-sim-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Bevy pinned EXACT per BL-82 [Q5]=A — bump only via the contained per-release PR (EM-6.3).
# No default features: the bridge is headless server-side (app/ecs/time come with the core set).
# `bevy_state`: replicon (via the protocol crate) drives `ClientState`/`ServerState`
# as Bevy states, and the terrain-drain system reads `ClientState`.
# `bevy_asset` (BL-82 EM-4.9, `oracle.rs`): the ORACLE producer reads
# `Assets<DmEvent>`/`AssetEvent<DmEvent>`/`Assets<EntityTemplate>` +
# `AssetServer` directly — requested explicitly here (same discipline
# `xindeler-dimensions`'/`xindeler-oracle-host`'s own Cargo.toml documents)
# rather than relying on it reaching this crate as an accident of
# `xindeler-oracle-host`'s own feature list.
bevy = { version = "=0.19.0", default-features = false, features = [
    "bevy_state",
    "bevy_asset",
] }
# The embedded specs simulation (EM-1.5). The bridge is a shell wrapper: it only
# calls the server's public API (`Server::new` / `tick` / `cleanup` /
# `create_centered_persister` / `state` / `world`).
server = { package = "xindeler-server-core", path = "../../server" }
# EM-3.7 entity mirror: name the sim's public comp types (`Pos`/`Ori`/`Vel`/
# `Body`/`Health`/`Presence`) to READ them off the specs storages, and the
# public `event::{CreateNpcEvent, NpcBuilder}` to REQUEST test-NPC spawns
# through the sim's own event bus (no server-internal machinery). `server` does
# not re-export `common`, so the bridge takes it directly. This is a logic crate
# used as a type library by a shell crate — the legal direction (shell → logic).
common = { package = "xindeler-common", path = "../../common" }
# EM-3.7b — the embedded LOCAL-PLAYER client. The listen server hosts the sim
# AND a real `xindeler-client-core::Client` connected over TCP loopback that IS
# the player's presence (keeps chunks loaded, receives a controllable
# character). Same crate + flow as the EM-1.6 smoke bot; server-side by design
# (a second sim/network stack is only legal here, never in the pure client).
client = { package = "xindeler-client-core", path = "../../client" }
# The replication contract (EM-3.6): the bridge writes `ToClients<CompressedChunk>`
# etc. on the same App the client plugins consume (listen-server single-App).
xindeler-protocol = { path = "../xindeler-protocol" }
bevy_replicon = "=0.41.1"
# `specs::Entity` for the sim↔Bevy mirror types. The logic crates don't re-export
# specs from their roots, so the bridge (shell, not logic) takes it directly.
specs = { workspace = true }
# `Server::new` requires an `Arc<tokio::Runtime>` (multi-thread, like server-cli).
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
# Read chunk keys / world positions off the sim (Vec2/Vec3), matching the logic
# crates' vek version.
vek = { workspace = true }
# BL-82 EM-5.6 (`trade.rs`): `common::trade::PendingTrade::offers` is typed
# over `hashbrown::HashMap` (not `std`'s) — named directly rather than
# guessing at a re-export, matching this crate's existing "name the sim's
# own types" discipline for `specs`/`vek` above.
hashbrown = { workspace = true }
# EM-4.5: tags every mirrored entity with `DimensionId(0)`/`DimensionRoot`
# (the default dimension, wrapped once at boot via `ensure_default_dimension`)
# and gates NEW mirror-entity creation on `DimensionLifecycle::
# accepts_new_entrants` — the "interaction with the mirror/visibility
# systems" spec §1.8 asks the `Draining` transition to have.
xindeler-dimensions = { path = "../xindeler-dimensions" }
# EM-4.7 (`entity_factory.rs`): `xindeler_oracle_host::entity_template`'s
# `Pending*` descriptor components + `AgentPreset` (the `BehaviorRegistry`
# half). This crate is "the ONLY legal `specs` consumer under `bevy/`" (this
# file's own module doc) — so the entity-factory adapter that actually turns
# those descriptors into a REAL sim NPC (via the SAME public
# `NpcBuilder`/`CreateNpcEvent`/`emit_event_now` path `spawn_test_npcs`
# already uses) has to live here, not in `xindeler-oracle-host` itself.
xindeler-oracle-host = { path = "../xindeler-oracle-host" }
# EM-4.7 (`entity_factory.rs`'s `spawn_from_spawning_rules`): scatters a
# `DmEvent.spawning_rules`-driven batch of spawns within `spawn_radius` of an
# origin. A seeded RNG (caller-supplied), never wall-clock/thread entropy —
# keeps the factory itself deterministic per the ORACLE invariant.
rand = { workspace = true }
# BL-82 EM-4.9 (`oracle.rs`'s `spawn_event_minions`): seeds a `ChaCha8Rng`
# (off the event `DimensionId`) for the REAL producer's own
# `spawn_from_spawning_rules` call — promoted from a dev-only test dependency
# (the EM-4.7 batch-spawn test already used it the same way) to a regular one
# now that production code calls it too.
rand_chacha = { workspace = true }
# BL-82 EM-5.5 (`map.rs`): names `common_net::msg::world_msg::PoiInfo` for
# `EmbeddedPlayer::pois`'s return type — `client::Client::pois()` already
# returns this type, but naming it in a function signature requires a direct
# dependency (the `client` crate doesn't re-export it at its own root).
common-net = { package = "xindeler-common-net", path = "../../common/net" }
# BL-82 EM-5.5 (`map.rs`): decodes `client::WorldData::map_image()`'s
# `Arc<DynamicImage>` into raw RGB pixels for the downsampled `NetMapData`
# background broadcast — the same `image` crate `client`/`world` already use
# to build that texture, pulled in here only to READ pixels back out.
image = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ron = { workspace = true }
# BL-82 EM-5.4/EM-5.8 tests build a real `comp::Player` fixture (`Player::new`
# takes a `Uuid`) — matches `common`'s own pinned version (`common/Cargo.toml`);
# no default features needed for a plain `Uuid::nil()`. Test-only.
uuid = { version = "1.4.1", default-features = false }
# BL-82 EM-5.8's `social` tests construct a real `comp::Stats.name: Content`
# fixture to exercise the name-flattening path — `common_i18n::Content` isn't
# re-exported through `common`'s own public API, so this crate (already
# a `common` dependent) takes it directly, same "type library" pattern
# `common`'s own Cargo.toml already establishes for it. Test-only.
common-i18n = { package = "xindeler-common-i18n", path = "../../common/i18n" }
