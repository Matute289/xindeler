[package]
name = "xindeler-sim-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Bevy pinned EXACT per BL-82 [Q5]=A — bump only via the contained per-release PR (EM-6.3).
# No default features: the bridge is headless server-side (app/ecs/time come with the core set).
# `bevy_state`: replicon (via the protocol crate) drives `ClientState`/`ServerState`
# as Bevy states, and the terrain-drain system reads `ClientState`.
bevy = { version = "=0.19.0", default-features = false, features = [
    "bevy_state",
] }
# The embedded specs simulation (EM-1.5). The bridge is a shell wrapper: it only
# calls the server's public API (`Server::new` / `tick` / `cleanup` /
# `create_centered_persister` / `state` / `world`).
server = { package = "xindeler-server-core", path = "../../server" }
# EM-3.7 entity mirror: name the sim's public comp types (`Pos`/`Ori`/`Vel`/
# `Body`/`Health`/`Presence`) to READ them off the specs storages, and the
# public `event::{CreateNpcEvent, NpcBuilder}` to REQUEST test-NPC spawns
# through the sim's own event bus (no server-internal machinery). `server` does
# not re-export `common`, so the bridge takes it directly. This is a logic crate
# used as a type library by a shell crate — the legal direction (shell → logic).
common = { package = "xindeler-common", path = "../../common" }
# The replication contract (EM-3.6): the bridge writes `ToClients<CompressedChunk>`
# etc. on the same App the client plugins consume (listen-server single-App).
xindeler-protocol = { path = "../xindeler-protocol" }
bevy_replicon = "=0.41.1"
# `specs::Entity` for the sim↔Bevy mirror types. The logic crates don't re-export
# specs from their roots, so the bridge (shell, not logic) takes it directly.
specs = { workspace = true }
# `Server::new` requires an `Arc<tokio::Runtime>` (multi-thread, like server-cli).
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
# Read chunk keys / world positions off the sim (Vec2/Vec3), matching the logic
# crates' vek version.
vek = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
