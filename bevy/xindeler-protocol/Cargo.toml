[package]
name = "xindeler-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Bevy pinned EXACT per BL-82 [Q5]=A — bump only via the contained per-release PR (EM-6.3).
# No render stack: only what the replication contract needs.
#   - `bevy_state`: bevy_replicon manages `ClientState`/`ServerState` as Bevy states.
bevy = { version = "=0.19.0", default-features = false, features = [
    "bevy_state",
] }
# Feature-only dep: turns on serde impls for `Vec3`/`Quat` (glam) used inside the
# Net* components. We enable `bevy_math/serialize` directly instead of the bevy
# facade's `serialize`, because the facade feature makes cargo resolve the
# optional `bevy_a11y 0.19.0`, which only exists as -rc on crates.io.
# Pinned EXACT per BL-82 [Q5]=A — bump only via the contained per-release PR (EM-6.3).
bevy_math = { version = "=0.19.0", default-features = false, features = [
    "serialize",
] }
# Networking per BL-82 [Q3]=B — replication contract shared by client & server.
bevy_replicon = "=0.41.1"
serde = { workspace = true }

# EM-3.6 terrain channel: `CompressedChunk` payloads are bincode(legacy)+lz4 —
# the SAME scheme Veloren's net stack uses (network/src/message.rs: bincode
# `legacy()` config + `lz_fear::raw::{compress2, decompress_raw}`), so no new
# compression crate enters the lock (lz-fear 0.2.0 was already pinned via
# `network`/`world`; "0.2" matches their requirement string).
bincode = { workspace = true }
lz-fear = "0.2"
# Logic crate as TYPE LIBRARY only ([Q3]=B): the chunk payload type is the
# sim's `TerrainChunk`. Legal direction (shell → logic); the isolation law
# forbids the reverse.
common = { package = "xindeler-common", path = "../../common", features = [
    "no-assets",
] }
vek = { workspace = true }
