[package]
name = "xindeler-oracle-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Bevy pinned EXACT per BL-82 [Q5]=A — bump only via the contained per-release PR (EM-6.3).
# `bevy_asset` only — this crate hosts the data-driven ORACLE assets (DmEvent,
# AtmosphereProfile, ...) and must stay render-free so the headless server shell
# can use it (spec §5). Apply-to-render systems live in `xindeler-client`.
# `file_watcher` (EM-4.3): the `oracle://` custom `AssetSource` (dm_event.rs)
# needs a REAL hot-reload watcher, and this crate must work headlessly (server
# shell) — it can't rely on `xindeler-client` re-exporting the feature into
# the build graph, so it requests it directly (same rationale as
# `xindeler-client/Cargo.toml`'s own `file_watcher` line).
bevy = { version = "=0.19.0", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_asset",
    "file_watcher",
] }
ron = { workspace = true }
serde = { workspace = true }
# EM-4.2e: `ai_gateway` registers its 2 zero-value counters on the SAME
# `prometheus::Registry` `xindeler-server-app::metrics` already wires.
prometheus = { workspace = true }
# EM-4.2e: `AiExecutionMode` lives in the low-level, few-deps `xindeler-protocol`
# crate (not here) so `xindeler-sim-bridge` — which already depends on
# `xindeler-protocol`, not on this crate — can read it with zero new
# dependency edges; this crate takes the one new (and directionally correct,
# higher-level -> lower-level) edge instead, to embed the type in
# `AiGatewayConfig`. See `ai_gateway`'s module doc for the full reasoning.
xindeler-protocol = { path = "../xindeler-protocol" }
# `DmEventLoader` (EM-4.3): ORACLE's LLM-side tooling emits JSON comfortably —
# `.dmevent.json` is parsed with this, `.dmevent.ron` with `ron` above (spec
# §5.1/§0.4).
serde_json = { workspace = true }

[dev-dependencies]
# `dm_event.rs`'s hot-reload test drops a real file into a real tempdir and
# waits for the `oracle://` source's file watcher to pick it up.
tempfile = { workspace = true }
