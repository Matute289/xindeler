[package]
name = "xindeler-oracle-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Bevy pinned EXACT per BL-82 [Q5]=A — bump only via the contained per-release PR (EM-6.3).
# `bevy_asset` only — this crate hosts the data-driven ORACLE assets (DmEvent,
# AtmosphereProfile, ...) and must stay render-free so the headless server shell
# can use it (spec §5). Apply-to-render systems live in `xindeler-client`.
# `file_watcher` (EM-4.3): the `oracle://` custom `AssetSource` (dm_event.rs)
# needs a REAL hot-reload watcher, and this crate must work headlessly (server
# shell) — it can't rely on `xindeler-client` re-exporting the feature into
# the build graph, so it requests it directly (same rationale as
# `xindeler-client/Cargo.toml`'s own `file_watcher` line).
bevy = { version = "=0.19.0", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_asset",
    "file_watcher",
] }
ron = { workspace = true }
serde = { workspace = true }
# EM-4.2e: `ai_gateway` registers its 2 zero-value counters on the SAME
# `prometheus::Registry` `xindeler-server-app::metrics` already wires.
prometheus = { workspace = true }
# EM-4.2e: `AiExecutionMode` lives in the low-level, few-deps `xindeler-protocol`
# crate (not here) so `xindeler-sim-bridge` — which already depends on
# `xindeler-protocol`, not on this crate — can read it with zero new
# dependency edges; this crate takes the one new (and directionally correct,
# higher-level -> lower-level) edge instead, to embed the type in
# `AiGatewayConfig`. See `ai_gateway`'s module doc for the full reasoning.
xindeler-protocol = { path = "../xindeler-protocol" }
# BL-82 EM-4.9 (Phase D, `atmosphere_sync.rs`): the per-dimension
# `SetClientAtmosphere` targeted message mirrors `xindeler_protocol::narrative`'s
# `HudToast`/`SendTargets::Single` pattern exactly, but the payload
# (`AtmosphereProfile`) lives in THIS crate (`atmosphere.rs`) — declaring the
# message in `xindeler-protocol` instead would need a backwards dependency
# edge (that crate never depends on this one). This crate already depends on
# `xindeler-protocol` (for `ClientViewpoint`/`DimensionId`, see the line
# above), so taking `bevy_replicon` directly here (rather than only via that
# crate) is the legal, non-circular way to register + send/receive its own
# message type. Pinned EXACT to match every other Bevy-migration crate's own
# pin (BL-82 [Q5]=A).
bevy_replicon = "=0.41.1"
# `DmEventLoader` (EM-4.3): ORACLE's LLM-side tooling emits JSON comfortably —
# `.dmevent.json` is parsed with this, `.dmevent.ron` with `ron` above (spec
# §5.1/§0.4).
serde_json = { workspace = true }
# EM-4.7 (`entity_template.rs`): `AgentPreset::build_agent` constructs a real
# `common::comp::Agent` (the existing, battle-tested server-agent AI data
# type — presets just tune its `Psyche` fields, exactly like `/spawn`/
# `/make_npc` already do in `server/src/cmd.rs`) plus `comp::Body`/
# `comp::Alignment`/`LootSpec` for the registry's built-in spawn closures.
# Legal shell -> logic type-library use (same pattern `xindeler-server-app`'s
# Cargo.toml documents for its own `common` dep) — this crate never embeds a
# `specs::World` itself, it only names these plain data types.
common = { package = "xindeler-common", path = "../../common" }
# `AgentPreset::build_agent`'s `with_patrol_origin` takes a `vek::Vec3<f32>`
# (the sim's own vector type, matching `common`'s `Agent`/`Pos` API) — same
# workspace version the logic crates use, so no double-conversion is needed.
vek = { workspace = true }

[dev-dependencies]
# `dm_event.rs`'s hot-reload test drops a real file into a real tempdir and
# waits for the `oracle://` source's file watcher to pick it up.
tempfile = { workspace = true }
