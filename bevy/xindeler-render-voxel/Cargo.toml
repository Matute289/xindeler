[package]
name = "xindeler-render-voxel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Bevy pinned EXACT per BL-82 [Q5]=A — bump only via the contained per-release PR (EM-6.3).
# Skeleton uses no default features (no render stack yet); features arrive with each phase.
bevy = { version = "=0.19.0", default-features = false }

# EM-3.1 (Mapper C5–C7): deps of the lift-copied greedy mesher.
# Logic-crate deps are legal in this direction (shell → logic); the isolation
# law only forbids the reverse.
common = { package = "xindeler-common", path = "../../common", features = [
    "no-assets",
] }
common-base = { package = "xindeler-common-base", path = "../../common/base" }
# Atlas allocator used by greedy.rs — SAME version as the frozen voxygen
# reference (voxygen/Cargo.toml: guillotiere = "0.7.0") so upstream fixes
# diff-port cleanly.
guillotiere = "0.7.0"
tracing = { workspace = true }
vek = { workspace = true }
