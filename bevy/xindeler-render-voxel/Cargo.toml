[package]
name = "xindeler-render-voxel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `pipeline` (→ material → convert) is on by default so a plain
# `cargo test -p xindeler-render-voxel` covers the EM-3.2 conversion, EM-3.4
# palette and EM-3.5 pipeline tests; `--no-default-features` still builds the
# pure CPU mesher (greedy/terrain/segment) with zero bevy render machinery.
default = ["pipeline"]
# EM-3.2: `Mesh<TerrainVertex>` → `bevy::mesh::Mesh` conversion. Minimal bevy
# 0.19 features (verified against bevy-0.19.0/Cargo.toml + bevy_internal):
# - `bevy_mesh`: gates the `bevy::mesh` re-export (Mesh, MeshVertexAttribute,
#   Indices, PrimitiveTopology, VertexFormat re-exported from wgpu_types) and
#   enables `bevy_image` (the `bevy::image` facade — used by EM-3.4),
# - `bevy_asset`: gates `bevy::asset` (RenderAssetUsages lives there in 0.19).
# Neither pulls bevy_render/wgpu — the mesher core stays render-free.
convert = ["bevy/bevy_mesh", "bevy/bevy_asset"]
# EM-3.3/3.4: `VoxelMaterialExt` (ExtendedMaterial extension + embedded WGSL)
# + the data-driven block palette (`BlockPalette` RON asset + procedural
# texture-array builder). `bevy_pbr` transitively enables bevy_core_pipeline
# → bevy_render → bevy_shader (facade module gates verified in
# bevy_internal-0.19.0/src/lib.rs).
material = ["convert", "bevy/bevy_pbr", "dep:serde", "dep:ron"]
# EM-3.5: async chunk meshing pipeline (dirty queue → AsyncComputeTaskPool →
# budgeted uploads). `multi_threaded` gives bevy_tasks real worker threads so
# the pipeline (and its headless test) actually meshes off the main thread.
pipeline = ["material", "bevy/multi_threaded"]
# EM-3.8: real `.vox` figures (Mapper C7/C12/C13). Assembles per-body voxel
# parts (`generate_mesh_base_vol_figure` → per-part `bevy::Mesh` with vertex
# colours) and places them with `xindeler-anim`'s rest-pose bone matrices. Adds
# `dot_vox` (parse the `.vox` bytes the client hands in — render-voxel keeps
# `common`'s `no-assets`, so it never touches `assets_manager`) and
# `xindeler-anim` (the kept skeletal-anim crate, C13 — a LOGIC crate, so this
# is the legal shell→logic direction the isolation guard allows).
figure = ["convert", "dep:dot_vox", "dep:xindeler-anim", "dep:serde"]
# EM-7.14 P1: the item-icon CPU voxel-to-image rasterizer. A faithful port of
# xindeler-old's `voxygen::ui::graphic::renderer` (`euc`-based software
# triangle rasterizer + per-voxel AO meshing) — reuses `figure`'s `dot_vox`/
# `common::figure::MatSegment` machinery to load+skin-strip the model, then
# rasterizes to a plain `image::RgbaImage`. No bevy render/wgpu dependency —
# the output is a CPU pixel buffer the client wraps as a `bevy::Image`.
item-icon = ["figure", "dep:euc", "dep:image"]

[dependencies]
# Bevy pinned EXACT per BL-82 [Q5]=A — bump only via the contained per-release PR (EM-6.3).
# The skeleton used no default features; EM-3.2/3.3 add the minimal per-phase
# feature sets above (never `default-features = true` — the client owns that).
bevy = { version = "=0.19.0", default-features = false }

# EM-3.1 (Mapper C5–C7): deps of the lift-copied greedy mesher.
# Logic-crate deps are legal in this direction (shell → logic); the isolation
# law only forbids the reverse.
common = { package = "xindeler-common", path = "../../common", features = [
    "no-assets",
] }
common-base = { package = "xindeler-common-base", path = "../../common/base" }
# Atlas allocator used by greedy.rs — SAME version as the frozen voxygen
# reference (voxygen/Cargo.toml: guillotiere = "0.7.0") so upstream fixes
# diff-port cleanly.
guillotiere = "0.7.0"
# EM-3.4 block palette (`material` feature): RON asset schema + loader.
ron = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true }
vek = { workspace = true }

# EM-3.8 figures (`figure` feature). `dot_vox` parses the `.vox` bytes the
# client streams in (SAME "5.x" line `common` pins so the `DotVoxData` type
# matches `common::figure::Segment::from_vox_*`). `xindeler-anim` is the kept
# skeletal-animation LOGIC crate (Mapper C13) — the legal shell→logic dep the
# isolation guard allows (anim never gains a bevy/render dep). No default
# features on either (mirrors the per-phase minimalism above).
dot_vox = { version = "5.1", optional = true }
xindeler-anim = { path = "../../voxygen/anim", optional = true, default-features = false }

# EM-7.14 P1 (`item-icon` feature): `euc` is the SAME software rasterizer
# xindeler-old's icon renderer used (`voxygen/Cargo.toml: euc = "0.5.3"`) —
# ported for faithful legacy fidelity (same per-voxel AO, same fixed
# lighting model) rather than hand-rolled. `image` produces the plain
# `RgbaImage` output; the workspace already pins it (`common/assets`).
euc = { version = "0.5.3", optional = true }
image = { workspace = true, optional = true }

[dev-dependencies]
# EM-3.8: the ignored `real_pig_manifests_parse` test reads + parses the frozen
# figure manifests to lock the deser shape against the real asset.
ron = { workspace = true }
