[package]
name = "xindeler-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# EM-3.6 listen-server: this binary HOSTS the embedded sim server shell +
# replicon server + the terrain bridge, replicating loopback to its own client
# plugins in ONE process/App ([Q3]=B, single-App listen server). SANCTIONED
# exception to "client links no server crates": in this mode the binary IS the
# server. The isolation law still holds — the PRESENTATION code (this crate's
# `src`) uses NO specs (CI greps for it, `check-engine-isolation.sh`);
# everything server-side lives in `xindeler-sim-bridge`, added as an OPTIONAL
# dep enabled only by this feature.
listen-server = [
    "dep:xindeler-sim-bridge",
    "dep:xindeler-protocol",
    "dep:bevy_replicon",
]
# BL-82 EM-4.2b: a genuinely REMOTE client role — real `bevy_replicon` client
# role + the new replicon+quinnet transport (`xindeler-transport`), connecting
# over a real network socket to a SEPARATE `xindeler-server-app` process. NOT
# the same thing as `listen-server` (which hosts an embedded sim + replicon
# SERVER role in-process, looping back locally, and therefore also needs
# `xindeler-sim-bridge`). This feature deliberately does NOT depend on
# `xindeler-sim-bridge` — a real remote client has nothing to host, so it
# never touches `specs` at all (the isolation law's "client stays pure" holds
# even more directly here than under `listen-server`'s sanctioned exception).
net-client = [
    "dep:xindeler-protocol",
    "dep:bevy_replicon",
    "dep:xindeler-transport",
]

[dependencies]
# Full default feature set (2d + 3d + ui + audio); `default_platform` (inside 3d/ui)
# already brings `default_font`, needed by the FPS overlay text.
# `file_watcher` (EM-2.4): asset hot reload — bevy_asset builds its notify-based
# watcher and AssetPlugin's default `watch_for_changes_override: None` resolves
# to watching in Unprocessed mode.
# `system_clipboard` (BL-82 chat rewrite): the chat input line reads/writes the
# real OS clipboard via `bevy::clipboard::Clipboard` (Cmd/Ctrl+C/X/V). That
# resource + its `ClipboardPlugin` are gated on this feature; it is otherwise
# only enabled TRANSITIVELY (via `bevy_text`), so declare it explicitly here so
# a future bevy bump can't silently drop chat copy/paste out from under us.
# `jpeg` (BL-82 main-menu visual parity): the reused legacy main-menu background
# art (`assets/voxygen/background/bg_main.jpg` — the only JPEG this client
# loads) needs the JPEG image decoder, which is NOT one of bevy's default image
# formats (only `png` is). Declared explicitly so the menu backdrop renders.
bevy = { version = "=0.19.0", features = ["file_watcher", "system_clipboard", "jpeg"] }
# fps-overlay: deliberate for Phase-2 validation; gate behind a GraphicsSettings
# toggle / debug_assertions before the EM-5.x UI gate (reviewer m5).
xindeler-app = { path = "../xindeler-app", features = ["fps-overlay"] }
# AtmosphereProfile asset + AtmosphereController (EM-2.4, spec §5.4).
xindeler-oracle-host = { path = "../xindeler-oracle-host" }
# BL-82 EM-5.10a (T56.34): the Kira-on-`cpal` audio foundation (`AudioManager`
# + 4 mixer sub-tracks + `.ogg`/`.wav` `AssetLoader`). A normal (non-optional)
# dependency like `xindeler-oracle-host`/`xindeler-ui` above — a general
# client capability, not `listen-server`-specific — even though it is only
# ADDED to the app in `listen_server.rs` today; nothing triggers a sound yet
# (SFX/music/ambience wiring is 5.10b–e).
xindeler-audio = { path = "../xindeler-audio" }
# BL-82 EM-5.1: the widget kit (panel/bar/button/tooltip/notification/theme/
# i18n) the core combat HUD (EM-5.2, `combat_hud.rs`) builds on.
xindeler-ui = { path = "../xindeler-ui" }
# BL-82 EM-5.11: the keymap/gamepad input-MODEL crate (GameInput, KeyMap,
# ActionState, the rebind-capture flow) `player_input.rs`/`camera.rs`/
# `controls_screen.rs` consume.
xindeler-input = { path = "../xindeler-input" }
# EM-3.2..3.5: greedy mesher + bevy conversion + VoxelMaterialExt + block
# palette (EM-3.4) + async chunk pipeline (EM-3.5).
xindeler-render-voxel = { path = "../xindeler-render-voxel", features = [
    "pipeline",
    # EM-3.8: real `.vox` figures (figure mesher + anim rest-pose bones).
    "figure",
] }
# Logic crates as TYPE LIBRARIES only ([Q3]=B): the voxel demo builds a
# synthetic `VolGrid2d<TerrainChunk>` with `common` terrain types. Legal
# direction (shell → logic); the isolation law forbids the reverse.
common = { package = "xindeler-common", path = "../../common", features = [
    "no-assets",
] }
vek = { workspace = true }
# BL-82 EM-5.7: `diary.rs` parses the frozen skill-tree RON manifests directly
# (see that module's own doc comment for why it does NOT go through
# `common`'s `assets_manager`-backed statics despite linking `common` for
# types) — needs `serde::de::DeserializeOwned` + a log line on a bad/missing
# manifest file.
serde = { workspace = true }
tracing = { workspace = true }
# BL-82 EM-5.10c (T56.36): `ambience.rs` iterates every
# `xindeler_audio::ambience::AmbienceChannelTag` each frame
# (`AmbienceChannelTag::iter()`), same as the old client's own
# `AmbienceMgr::maintain`.
strum = { workspace = true }
# BL-82 EM-5.10c (T56.36): `music.rs` seeds `MusicMachine::advance`'s rng
# argument with a fresh per-frame `rand::rng()`, same convention
# `xindeler-audio::sfx::playback::trigger_sfx`'s own callers use.
rand = { workspace = true }
# EM-3.8: parse the `.vox` bytes the client loads via `AssetServer` into the
# `DotVoxData` the figure loader consumes (SAME "5.x" line `common` pins).
dot_vox = "5.1"
# EM-3.8: deserialise the frozen-name figure manifests via a tiny `AssetLoader`
# (same crate the block-palette loader uses). Promoted from dev-dep.
ron = { workspace = true }

# EM-3.6 listen-server (optional; enabled by the `listen-server` feature). The
# server SHELL + terrain bridge (the only crate under bevy/ that touches specs)
# and the shared replication contract. Pinned EXACT per BL-82 [Q5]=A.
xindeler-sim-bridge = { path = "../xindeler-sim-bridge", optional = true }
# Shared by BOTH `listen-server` (loopback) and `net-client` (real socket,
# EM-4.2b) — the replication contract itself never changes with the
# transport underneath it.
xindeler-protocol = { path = "../xindeler-protocol", optional = true }
bevy_replicon = { version = "=0.41.1", optional = true }
# BL-82 EM-4.2b (optional; enabled by the `net-client` feature only). The
# transport seam — this crate calls ONLY
# `xindeler_transport::{ReplicaTransport, TransportConfig, QuinnetTransport}`,
# never `bevy_replicon_quinnet`/`bevy_quinnet` types directly (see that
# crate's own doc comment for the grep bar this maintains).
xindeler-transport = { path = "../xindeler-transport", optional = true }

# (Tests that validate the smoke harness's baked extreme profile parses use
# `ron`, now a normal dependency above — EM-3.8.)

[dev-dependencies]
# BL-82 EM-3.12: the real-embedded-world camera-collision integration test
# (`terrain_stream.rs`) boots a real `xindeler-sim-bridge::boot_test_server`
# world into a scratch dir, same as that crate's own `#[ignore]`d
# `streams_real_chunks_to_local_client` test.
tempfile = { workspace = true }
# BL-82 EM-5.8's `social_hud` tests build a real `common::rtsim::Dialogue`
# fixture, whose `Response.msg`/`DialogueKind::{Statement,Question}.msg` are
# `common_i18n::Content` — not re-exported through `common`'s own public API,
# so this crate (already a `common` dependent) takes it directly, same
# "type library" pattern `common` itself already establishes for it (mirrors
# `xindeler-sim-bridge`'s own dev-dependency for the identical reason).
# Test-only.
common-i18n = { package = "xindeler-common-i18n", path = "../../common/i18n" }
# BL-82 EM-5.7's `diary` tests build real `common::comp::skillset::
# SkillPrerequisite::All`/`Any` fixtures, whose inner map is `hashbrown::
# HashMap` (not `std::collections::HashMap`) — same "type library" dev-dep
# pattern as `common-i18n` just above. Test-only.
hashbrown = { workspace = true }
