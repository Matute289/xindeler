[package]
name = "xindeler-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# EM-3.6 listen-server: this binary HOSTS the embedded sim server shell +
# replicon server + the terrain bridge, replicating loopback to its own client
# plugins in ONE process/App ([Q3]=B, single-App listen server). SANCTIONED
# exception to "client links no server crates": in this mode the binary IS the
# server. The isolation law still holds — the PRESENTATION code (this crate's
# `src`) uses NO specs (CI greps for it, `check-engine-isolation.sh`);
# everything server-side lives in `xindeler-sim-bridge`, added as an OPTIONAL
# dep enabled only by this feature.
listen-server = [
    "dep:xindeler-sim-bridge",
    "dep:xindeler-protocol",
    "dep:bevy_replicon",
]

[dependencies]
# Full default feature set (2d + 3d + ui + audio); `default_platform` (inside 3d/ui)
# already brings `default_font`, needed by the FPS overlay text.
# `file_watcher` (EM-2.4): asset hot reload — bevy_asset builds its notify-based
# watcher and AssetPlugin's default `watch_for_changes_override: None` resolves
# to watching in Unprocessed mode.
bevy = { version = "=0.19.0", features = ["file_watcher"] }
# fps-overlay: deliberate for Phase-2 validation; gate behind a GraphicsSettings
# toggle / debug_assertions before the EM-5.x UI gate (reviewer m5).
xindeler-app = { path = "../xindeler-app", features = ["fps-overlay"] }
# AtmosphereProfile asset + AtmosphereController (EM-2.4, spec §5.4).
xindeler-oracle-host = { path = "../xindeler-oracle-host" }
# EM-3.2..3.5: greedy mesher + bevy conversion + VoxelMaterialExt + block
# palette (EM-3.4) + async chunk pipeline (EM-3.5).
xindeler-render-voxel = { path = "../xindeler-render-voxel", features = [
    "pipeline",
] }
# Logic crates as TYPE LIBRARIES only ([Q3]=B): the voxel demo builds a
# synthetic `VolGrid2d<TerrainChunk>` with `common` terrain types. Legal
# direction (shell → logic); the isolation law forbids the reverse.
common = { package = "xindeler-common", path = "../../common", features = [
    "no-assets",
] }
vek = { workspace = true }

# EM-3.6 listen-server (optional; enabled by the `listen-server` feature). The
# server SHELL + terrain bridge (the only crate under bevy/ that touches specs)
# and the shared replication contract. Pinned EXACT per BL-82 [Q5]=A.
xindeler-sim-bridge = { path = "../xindeler-sim-bridge", optional = true }
xindeler-protocol = { path = "../xindeler-protocol", optional = true }
bevy_replicon = { version = "=0.41.1", optional = true }

[dev-dependencies]
# Tests validate that the smoke harness's baked extreme profile parses.
ron = { workspace = true }
